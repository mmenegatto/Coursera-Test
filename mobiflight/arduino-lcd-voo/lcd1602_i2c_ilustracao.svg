<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="760" fill="#f4f4f2"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">LCD 1602 com placa I2C (PCF8574) — ilustração</text>

  <!-- ===================== FRENTE ===================== -->
  <text x="250" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">FRENTE</text>
  <!-- PCB -->
  <rect x="40" y="95" width="420" height="190" rx="8" fill="#1f6f3a" stroke="#0f3d20" stroke-width="2"/>
  <circle cx="58" cy="113" r="7" fill="#f4f4f2" stroke="#0f3d20"/>
  <circle cx="442" cy="113" r="7" fill="#f4f4f2" stroke="#0f3d20"/>
  <circle cx="58" cy="267" r="7" fill="#f4f4f2" stroke="#0f3d20"/>
  <circle cx="442" cy="267" r="7" fill="#f4f4f2" stroke="#0f3d20"/>
  <!-- metal bezel -->
  <rect x="70" y="128" width="360" height="130" rx="4" fill="#2b2b2b"/>
  <!-- display glass -->
  <rect x="90" y="148" width="320" height="90" rx="3" fill="#2f6fd1"/>
  <text x="104" y="185" font-family="Courier New, monospace" font-size="26" fill="#e9f2ff">SPD250 ALT12000</text>
  <text x="104" y="222" font-family="Courier New, monospace" font-size="26" fill="#e9f2ff">HDG 90 VS -1500</text>
  <!-- 16 pin header holes on top -->
  <g fill="#d9b44a">
    <circle cx="96" cy="106" r="3"/><circle cx="108" cy="106" r="3"/><circle cx="120" cy="106" r="3"/><circle cx="132" cy="106" r="3"/>
    <circle cx="144" cy="106" r="3"/><circle cx="156" cy="106" r="3"/><circle cx="168" cy="106" r="3"/><circle cx="180" cy="106" r="3"/>
    <circle cx="192" cy="106" r="3"/><circle cx="204" cy="106" r="3"/><circle cx="216" cy="106" r="3"/><circle cx="228" cy="106" r="3"/>
    <circle cx="240" cy="106" r="3"/><circle cx="252" cy="106" r="3"/><circle cx="264" cy="106" r="3"/><circle cx="276" cy="106" r="3"/>
  </g>
  <text x="250" y="310" text-anchor="middle" font-size="14" fill="#444">Tela azul com 2 linhas × 16 caracteres</text>

  <!-- ===================== VERSO ===================== -->
  <text x="750" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">VERSO (placa I2C soldada)</text>
  <rect x="540" y="95" width="420" height="190" rx="8" fill="#1f6f3a" stroke="#0f3d20" stroke-width="2"/>
  <circle cx="558" cy="113" r="7" fill="#f4f4f2" stroke="#0f3d20"/>
  <circle cx="942" cy="113" r="7" fill="#f4f4f2" stroke="#0f3d20"/>
  <circle cx="558" cy="267" r="7" fill="#f4f4f2" stroke="#0f3d20"/>
  <circle cx="942" cy="267" r="7" fill="#f4f4f2" stroke="#0f3d20"/>
  <!-- backpack board (mirrored side: header is on the right in back view) -->
  <rect x="690" y="100" width="260" height="78" rx="4" fill="#1d1d1d" stroke="#000"/>
  <!-- 16 soldered pins row -->
  <g fill="#c9c9c9">
    <circle cx="726" cy="108" r="3"/><circle cx="738" cy="108" r="3"/><circle cx="750" cy="108" r="3"/><circle cx="762" cy="108" r="3"/>
    <circle cx="774" cy="108" r="3"/><circle cx="786" cy="108" r="3"/><circle cx="798" cy="108" r="3"/><circle cx="810" cy="108" r="3"/>
    <circle cx="822" cy="108" r="3"/><circle cx="834" cy="108" r="3"/><circle cx="846" cy="108" r="3"/><circle cx="858" cy="108" r="3"/>
    <circle cx="870" cy="108" r="3"/><circle cx="882" cy="108" r="3"/><circle cx="894" cy="108" r="3"/><circle cx="906" cy="108" r="3"/>
  </g>
  <!-- PCF8574 chip -->
  <rect x="760" y="128" width="78" height="34" rx="2" fill="#0b0b0b" stroke="#555"/>
  <text x="799" y="149" text-anchor="middle" font-size="11" fill="#bbb">PCF8574</text>
  <!-- trimpot -->
  <rect x="845" y="126" width="38" height="38" rx="3" fill="#2a63c9" stroke="#123a80"/>
  <circle cx="864" cy="145" r="11" fill="#e6e6e6" stroke="#666"/>
  <line x1="864" y1="136" x2="864" y2="154" stroke="#333" stroke-width="3"/>
  <!-- A0 A1 A2 pads -->
  <g fill="#d9b44a"><rect x="712" y="128" width="9" height="7"/><rect x="712" y="140" width="9" height="7"/><rect x="712" y="152" width="9" height="7"/></g>
  <text x="726" y="135" font-size="9" fill="#ddd">A0</text>
  <text x="726" y="147" font-size="9" fill="#ddd">A1</text>
  <text x="726" y="159" font-size="9" fill="#ddd">A2</text>
  <!-- backlight jumper -->
    <rect x="893" y="128" width="20" height="18" rx="2" fill="#000" stroke="#777"/>
  <text x="903" y="124" text-anchor="middle" font-size="9" fill="#ddd">LED</text>
  <!-- 4-pin header -->
  <rect x="936" y="104" width="18" height="70" fill="#000"/>
  <g fill="#d9b44a"><rect x="941" y="110" width="8" height="8"/><rect x="941" y="126" width="8" height="8"/><rect x="941" y="142" width="8" height="8"/><rect x="941" y="158" width="8" height="8"/></g>
  <text x="932" y="118" text-anchor="end" font-size="10" fill="#ddd">GND</text>
  <text x="932" y="134" text-anchor="end" font-size="10" fill="#ddd">VCC</text>
  <text x="932" y="150" text-anchor="end" font-size="10" fill="#ddd">SDA</text>
  <text x="932" y="166" text-anchor="end" font-size="10" fill="#ddd">SCL</text>

  <!-- numbered badges on components -->
  <g font-size="13" font-weight="bold" fill="#fff">
    <circle cx="799" cy="186" r="11" fill="#c0392b"/><text x="799" y="191" text-anchor="middle">1</text>
    <circle cx="864" cy="186" r="11" fill="#c0392b"/><text x="864" y="191" text-anchor="middle">2</text>
    <circle cx="903" cy="186" r="11" fill="#c0392b"/><text x="903" y="191" text-anchor="middle">3</text>
    <circle cx="716" cy="186" r="11" fill="#c0392b"/><text x="716" y="191" text-anchor="middle">4</text>
    <circle cx="945" cy="196" r="11" fill="#c0392b"/><text x="945" y="201" text-anchor="middle">5</text>
  </g>
  <g font-size="14" fill="#222">
    <text x="545" y="318"><tspan font-weight="bold" fill="#c0392b">1</tspan>  Chip PCF8574: transforma os 16 pinos do LCD em 2 fios (I2C)</text>
    <text x="545" y="342"><tspan font-weight="bold" fill="#c0392b">2</tspan>  Potenciômetro azul: CONTRASTE (gire com chave de fenda)</text>
    <text x="545" y="366"><tspan font-weight="bold" fill="#c0392b">3</tspan>  Jumper "LED": encaixado = luz de fundo acesa</text>
    <text x="545" y="390"><tspan font-weight="bold" fill="#c0392b">4</tspan>  Pads A0/A1/A2: endereço I2C (de fábrica 0x27 ou 0x3F)</text>
    <text x="545" y="414"><tspan font-weight="bold" fill="#c0392b">5</tspan>  4 pinos de ligação: GND · VCC · SDA · SCL</text>
  </g>

  <!-- ===================== LIGACAO ===================== -->
  <text x="250" y="360" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">LIGAÇÃO NO ARDUINO UNO</text>
  <rect x="40" y="380" width="420" height="230" rx="10" fill="#0f5c8c" stroke="#083a59" stroke-width="2"/>
  <text x="250" y="420" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">Arduino UNO R3</text>
  <!-- power header -->
  <rect x="70" y="560" width="150" height="26" fill="#000"/>
  <text x="80" y="578" font-size="12" fill="#fff">5V</text>
  <text x="120" y="578" font-size="12" fill="#fff">GND</text>
  <!-- analog header -->
  <rect x="250" y="560" width="190" height="26" fill="#000"/>
  <text x="258" y="578" font-size="12" fill="#fff">A0 A1 A2 A3</text>
  <text x="370" y="578" font-size="12" fill="#ffd54a">A4 A5</text>
  <!-- wires: saem do Uno, descem, correm pela base e sobem pela borda direita ate o conector -->
  <g stroke-width="4" fill="none" stroke-linejoin="round">
    <path d="M 129 586 V 712 H 993 V 114 H 954" stroke="#111"/>
    <path d="M 86 586 V 700 H 985 V 130 H 954" stroke="#d62728"/>
    <path d="M 378 586 V 688 H 977 V 146 H 954" stroke="#2ca02c"/>
    <path d="M 410 586 V 676 H 969 V 162 H 954" stroke="#ff9800"/>
  </g>
  <g font-size="14">
    <rect x="545" y="470" width="380" height="130" rx="6" fill="#fff" stroke="#ccc"/>
    <text x="560" y="495" font-weight="bold" fill="#222">LCD (placa I2C)  →  Arduino Uno</text>
    <rect x="560" y="507" width="14" height="10" fill="#111"/><text x="582" y="517" fill="#222">GND  →  GND</text>
    <rect x="560" y="529" width="14" height="10" fill="#d62728"/><text x="582" y="539" fill="#222">VCC  →  5V</text>
    <rect x="560" y="551" width="14" height="10" fill="#2ca02c"/><text x="582" y="561" fill="#222">SDA  →  A4</text>
    <rect x="560" y="573" width="14" height="10" fill="#ff9800"/><text x="582" y="583" fill="#222">SCL  →  A5</text>
  </g>
  <text x="500" y="745" text-anchor="middle" font-size="12" fill="#666">Ilustração esquemática — cores e posição dos componentes variam conforme o fabricante do módulo.</text>
</svg>
